services:
  db:
    image: postgres:17-alpine
    container_name: stoploss-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stoploss
      POSTGRES_PASSWORD: stoploss
      POSTGRES_DB: stoploss
    ports:
      - "5435:5432"
    volumes:
      - stoploss-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stoploss -d stoploss"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stoploss-db-data:
